<html>
	<head>
		<script src='nui://game/ui/jquery.js' type='text/javascript'></script>
		<link rel="stylesheet" href="styles/main.css">
		<link rel="stylesheet" href="styles/de.css">
		<link rel="stylesheet" href="styles/us.css">
		<link rel="stylesheet" href="styles/uk.css">
	</head>
	<body>
		<!-- US-Style prescription pad -->
		<div class="us-main main">
			<div class="us-header">
				<img src="./assets/us-rx.jpg" class="us-logo">
				<div class="us-header-info">
					<h1>PRESCRIPTION</h1>
					<div>
						<input class="us-input-name data" id="name">
						<p>Patient Name:</p>
					</div>
					<div>
						<input class="us-input-adress data" id="adress">
						<p>Adress:</p>
					</div>
					<div>
						<input class="us-input-dob data" id="dob">
						<p>DOB:</p>
					</div>
				</div>
			</div>
			<hr class="us-hr">
			<div class="us-medication">
				<label>Medication:</label>
				<input class="us-medication-summary data" id="medication" readonly>
				<button type="button" class="medication-open">Edit medications</button>
			</div>

			<textarea class="us-notes data" id="notes"></textarea>
			<hr class="us-hr">

			<div class="us-footer">
				<div>
					<label>Date:</label>
					<label id="date">4/20/2025</label>
				</div>
				<div>
					<label>Signature:</label>
					<input class="us-signature data" id="signature">
				</div>
			</div>
		</div>

		<!-- DE-Style prescription -->
		<div class="de-main main">
			<input class="de-payer data" id="payer">
			
			<textarea class="de-patientinfo data" id="patientinfo"></textarea>
			<input class="de-dob data" id="dob">
			<input class="de-expiry data" id="expiry">

			<input class="de-insurernr data" id="insurernr">
			<input class="de-insurancenr data" id="insurancenr">
			<input class="de-status data" id="status">

			<input class="de-officenr data" id="officenr">
			<input class="de-doctornr data" id="doctornr">
			<label class="de-date" id="date">20.04.2025</label>

			<input class="de-medication-summary data" id="medication" readonly>
			<button type="button" class="de-medication-open medication-open">Edit medications</button>
			<textarea class="de-notes data" id="notes"></textarea>

			<input class="de-signature data" id="signature">

			<input class="de-accidentday data" id="accidentday">
			<input class="de-accidentemployer data" id="accidentemployer">

			<input class="de-reason data" id="reason">
		</div>


		<!-- UK NHS Style prescription -->
		<div class="uk-main main">
			<label class="uk-lbl_stamp">Pharmacy Stamp</label>
			<label class="uk-lbl_stampwarn">Please don't stamp over age box</label>

			<label class="uk-lbl_age">Age</label>
			<input class="uk-age data" id="age">
			<label class="uk-lbl_dob">D.o.B</label>
			<input class="uk-dob data" id="dob">

			<label class="uk-lbl_duration">Number of days' treatement<br>N.B. Ensure dose is stated</label>
			<input class="uk-duration data" id="duration">

			<label class="uk-lbl_patient">Title, Forename, Surname & Adress</label>
			<textarea class="uk-patient data" id="patient"></textarea>
			<label class="uk-lbl_nhsnr">NHS Number:</label>
			<input class="uk-nhsnr data" id="nhsnr">

			<label class="uk-lbl_endorsements">Endorsements</label>
			<div class="uk-container_meds">
				<input class="uk-medication-summary data" id="medication" readonly>
				<button type="button" class="uk-medication-open medication-open">Edit medications</button>
			</div>
			<textarea class="uk-notes data" id="notes"></textarea>

			<label class="uk-lbl_signature">Signature of Prescriber</label>
			<input class="uk-signature data" id="signature">
			<label class="uk-lbl_date">Date</label>
			<label class="uk-date" id="date">1/10/25</label>

			<label class="uk-lbl_info">For<br>Dispenser<br>No. of<br>Prescns.<br>on form</label>
			<textarea class="uk-info data" id="info"></textarea>
		</div>


		<!-- BUTTONS -->
		<div class="buttons">
			<button id="cancel">Cancel</button>
			<button id="submit">Submit</button>
		</div>

		<div class="med-picker main" aria-hidden="true">
			<div class="med-picker-panel">
				<div class="med-picker-heading">
					<div>
						<span class="med-picker-kicker">Prescription</span>
						<h2>Choose medications</h2>
					</div>
					<button type="button" class="med-picker-close" aria-label="Close medication picker">&times;</button>
				</div>
				<p class="med-picker-help">Add one or more medicines and set the amount for each.</p>
				<div class="medication-rows"></div>
				<button type="button" class="medication-add">+ Add medication</button>
				<div class="med-picker-actions">
					<button type="button" class="med-picker-done">Done</button>
				</div>
			</div>
		</div>
	</body>
</html>
